[package]
name = "herdr-annotator"
version = "0.2.0"
edition = "2024"
description = "Persistent, line-anchored reviews for Herdr App and herdr-core"
license = "MIT"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
